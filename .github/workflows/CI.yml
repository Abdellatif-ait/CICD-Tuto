name: CI

on:
  push:

jobs:
  # ---------------------------------------------------------
  # CHECK PROJECT EXISTS
  # ---------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify file exists
        run: |
          cd CICD_APP
          test -f CICD_APP.csproj
          echo "✔️ CICD_APP.csproj found"


  # ---------------------------------------------------------
  # BUILD + TEST (.NET)
  # ---------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # -----------------------------
      # Add Artifactory NuGet feed
      # -----------------------------
      - name: Add Artifactory NuGet source
        run: |
          dotnet nuget remove source Artifactory || true
          dotnet nuget add source "$ARTIFACTORY_NUGET_URL" \
            --name Artifactory \
            --username "$ARTIFACTORY_USER" \
            --password "$ARTIFACTORY_PASSWORD" \
            --store-password-in-clear-text
        env:
          ARTIFACTORY_NUGET_URL: ${{ secrets.ARTIFACTORY_NUGET_URL }}
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Restore dependencies
        run: dotnet restore CICD_APP.sln

      - name: Build the project
        run: dotnet build CICD_APP.sln --configuration Release --no-restore

      - name: Run all tests in solution
        run: dotnet test CICD_APP.sln --no-restore --logger "console;verbosity=minimal"

  # ---------------------------------------------------------
  # JFROG XRAY SCAN (dependencies + docker image)
  # ---------------------------------------------------------
  xray-scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ------------------------------
      # Install JFrog CLI
      # ------------------------------
      - name: Install JFrog CLI
        run: |
          curl -fL https://getcli.jfrog.io | sh
          sudo mv jfrog /usr/local/bin/jfrog

      # ------------------------------
      # Configure JFrog CLI
      # ------------------------------
      - name: Configure JFrog CLI
        run: |
          jfrog config add xray-server \
            --artifactory-url="${{ secrets.JFROG_URL }}" \
            --user="${{ secrets.JFROG_XRAY_USER }}" \
            --password="${{ secrets.JFROG_XRAY_PASSWORD }}" \
            --interactive=false

      # -------------------------------------------------------
      # Scan project dependencies (.NET, NuGet, etc.)
      # -------------------------------------------------------
      - name: Xray scan dependencies
        run: |
          jfrog scan CICD_APP/CICD_APP.csproj --format=json > xray-deps.json
          cat xray-deps.json

      # -------------------------------------------------------
      # Build Docker image for scanning
      # -------------------------------------------------------
      - name: Build Docker image for scan
        run: |
          docker build \
            -t cicd_app_scan \
            CICD_APP

      # -------------------------------------------------------
      # 3️⃣ Scan Docker image
      # -------------------------------------------------------
      - name: Xray scan docker image
        run: |
          jfrog scan docker://cicd_app_scan:latest --format=json > xray-docker.json
          cat xray-docker.json

      # -------------------------------------------------------
      # 4️⃣ Fail pipeline if vulnerabilities found
      # -------------------------------------------------------
      - name: Fail if scan detects critical vulns
        run: |
          if grep -q '"severity":"Critical"' xray-docker.json; then
            echo "❌ Critical vulnerabilities found!"
            exit 1
          fi
          echo "✔️ No critical vulnerabilities detected."



  # ---------------------------------------------------------
  # BUILD & PUSH DOCKER IMAGE TO GHCR
  # ---------------------------------------------------------
  docker-ghcr:
    runs-on: ubuntu-latest
    needs: xray-scan
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./CICD_APP
          push: true
          build-args: |
            NUGET_USER=${{ secrets.ARTIFACTORY_USER }}
            NUGET_PASSWORD=${{ secrets.ARTIFACTORY_PASSWORD }}
            NUGET_SOURCE_URL=${{ secrets.ARTIFACTORY_NUGET_URL }}
          tags: |
            ghcr.io/abdellatif-ait/cicd-tuto:latest
            ghcr.io/abdellatif-ait/cicd-tuto:${{ github.sha }}


  # ---------------------------------------------------------
  # BUILD & PUSH DOCKER IMAGE TO DOCKER HUB
  # ---------------------------------------------------------
  docker-hub:
    runs-on: ubuntu-latest
    needs: xray-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NUGET_USER=${{ secrets.ARTIFACTORY_USER }} \
            --build-arg NUGET_PASSWORD=${{ secrets.ARTIFACTORY_PASSWORD }} \
            --build-arg NUGET_SOURCE_URL=${{ secrets.ARTIFACTORY_NUGET_URL }} \
            -t ${{ secrets.DOCKER_USER }}/cicd_app:latest \
            CICD_APP

          docker tag \
            ${{ secrets.DOCKER_USER }}/cicd_app:latest \
            ${{ secrets.DOCKER_USER }}/cicd_app:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USER }}/cicd_app:latest
          docker push ${{ secrets.DOCKER_USER }}/cicd_app:${{ github.sha }}
  # ---------------------------------------------------------
  # PUSH DOCKER IMAGE TO JFROG ARTIFACTORY
  # ---------------------------------------------------------
  docker-jfrog:
    runs-on: ubuntu-latest
    needs: xray-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 🔐 Log in to Artifactory Docker registry
      - name: Login to JFrog Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.JFROG_DOCKER_URL }}
          username: ${{ secrets.JFROG_USER }}
          password: ${{ secrets.JFROG_PASSWORD }}

      # 🛠 Build image with NuGet args
      - name: Build Docker image
        run: |
          docker build \
            --build-arg NUGET_USER=${{ secrets.ARTIFACTORY_USER }} \
            --build-arg NUGET_PASSWORD=${{ secrets.ARTIFACTORY_PASSWORD }} \
            --build-arg NUGET_SOURCE_URL=${{ secrets.ARTIFACTORY_NUGET_URL }} \
            -t ${{ secrets.JFROG_DOCKER_URL }}/${{ secrets.JFROG_REPO }}/cicd_app:latest \
            CICD_APP

          docker tag \
            ${{ secrets.JFROG_DOCKER_URL }}/${{ secrets.JFROG_REPO }}/cicd_app:latest \
            ${{ secrets.JFROG_DOCKER_URL }}/${{ secrets.JFROG_REPO }}/cicd_app:${{ github.sha }}

      # 🚀 Push to Artifactory
      - name: Push Docker image to JFrog
        run: |
          docker push ${{ secrets.JFROG_DOCKER_URL }}/${{ secrets.JFROG_REPO }}/cicd_app:latest
          docker push ${{ secrets.JFROG_DOCKER_URL }}/${{ secrets.JFROG_REPO }}/cicd_app:${{ github.sha }}
# ---------------------------------------------------------
# PULL LATEST IMAGE FROM JFROG ARTIFACTORY
# ---------------------------------------------------------
  docker-jfrog-pull:
    runs-on: ubuntu-latest
    needs: docker-jfrog 
  
    steps:
      - name: Login to JFrog Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.JFROG_DOCKER_URL }}
          username: ${{ secrets.JFROG_USER }}
          password: ${{ secrets.JFROG_PASSWORD }}
  
      - name: Pull latest image
        run: |
          docker pull ${{ secrets.JFROG_DOCKER_URL }}/${{ secrets.JFROG_REPO }}/cicd_app:latest
  
      - name: Verify image exists
        run: docker images
  
      - name: Run image 
        run: |
          docker run -d --name cicd_test -p 8080:8080 \
            ${{ secrets.JFROG_DOCKER_URL }}/${{ secrets.JFROG_REPO }}/cicd_app:latest
        
          # Wait a few seconds
          sleep 5
  
          # Check container logs
          docker logs cicd_test
  
          # Stop container
          docker stop cicd_test
          docker rm cicd_test
      

name: CI

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify file exists
        run: |
          cd CICD_APP
          test -f CICD_APP.csproj
          echo "✔️ CICD_APP.csproj found"

  build:
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore CICD_APP.sln

      - name: Build the project
        run: dotnet build CICD_APP.sln --configuration Release --no-restore

      - name: Run all tests in solution
        run: dotnet test CICD_APP.sln --no-restore --logger "console;verbosity=minimal"

      # ---------------------------------------------------------
      # 🔐 GHCR (GitHub Container Registry)
      # ---------------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./CICD_APP/Dockerfile           # <-- FIXED: path to Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cicd_app:latest
            ghcr.io/${{ github.repository_owner }}/cicd_app:${{ github.sha }}

      # ---------------------------------------------------------
      # 🐳 DOCKER HUB (Manual build)
      # ---------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/cicd_app:latest -f CICD_APP/Dockerfile .
          docker tag ${{ secrets.DOCKER_USER }}/cicd_app:latest ${{ secrets.DOCKER_USER }}/cicd_app:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USER }}/cicd_app:latest
          docker push ${{ secrets.DOCKER_USER }}/cicd_app:${{ github.sha }}

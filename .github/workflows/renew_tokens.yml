name: Renew JFrog Tokens

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        token:
          - { name: "JFROG_PASSWORD", repo: "sga-docker-local" }
    outputs:
      any_token_renewed: ${{ steps.set_output.outputs.any_renewed }}  # fine for a single matrix

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq

      - name: Authenticate GH CLI
        run: |
          echo "${{ secrets.GH_PAT }}" | gh auth login --with-token

      - name: Set Token Value
        id: token
        run: |
          # Here we must hardcode the secret names using matrix
          if [[ "${{ matrix.token.name }}" == "JFROG_PASSWORD" ]]; then
            TOKEN="${{ secrets.JFROG_PASSWORD }}"
          fi
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Check Token Expiry
        id: check
        run: |
          DAYS_LEFT=0
          if [[ "$TOKEN" == reftkn:* ]]; then
            DECODED=$(echo "$TOKEN" | base64 --decode 2>/dev/null || echo "$TOKEN")
            EXPIRY_EPOCH=$(echo "$DECODED" | cut -d ':' -f3)
          elif [[ "$TOKEN" =~ ^ey ]]; then
            PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | base64 --decode | tr -d '\n')
            EXPIRY_EPOCH=$(echo "$PAYLOAD" | jq -r '.exp')
          else
            echo "Unknown token format"
            EXPIRY_EPOCH=0
          fi
          NOW=$(date +%s)
          DIFF=$((EXPIRY_EPOCH - NOW))
          DAYS_LEFT=$((DIFF / 86400))
          echo "days_left=$DAYS_LEFT" >> $GITHUB_OUTPUT
          echo "$DAYS_LEFT days left for ${{ matrix.token.name }}"

      - name: Create Issue if Expiring
        if: ${{ steps.check.outputs.days_left <= 7 }}
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = `${{ matrix.token.name }} JFrog Token Expiring Soon`;
      
            // Search for an open issue with this exact title
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });
      
            const exists = issues.some(issue => issue.title === title);
      
            if (exists) {
              console.log("Issue already exists and is open. Skipping creation.");
            } else {
              console.log("Issue does not exist. Creating new one.");
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: `Your JFrog token for repo ${{ matrix.token.repo }} will expire in ${{ steps.check.outputs.days_left }} days.`
              });
            }

      - name: Renew Token if Expired
        if: ${{ steps.check.outputs.days_left <= 0 }}
        run: |
          echo "Renewing token for ${{ matrix.token.name }}..."
          JFROG_USER="${{ secrets.JFROG_USER }}"
          JFROG_PASSWORD="${{ secrets.JF_ACCESS_TOKEN }}"
          JFROG_URL="${{ secrets.JFROG_PLATFORM_URL }}"

          RESPONSE=$(curl -s -H "Authorization: Bearer $JFROG_PASSWORD" -X POST "$JFROG_URL/access/api/v1/tokens" \
            -H "Content-Type: application/json" \
            -d '{
                  "username": "'"$JFROG_USER"'",
                  "scope": "artifact:'"${{ matrix.token.repo }}"':r,w",
                  "expires_in": 345600
                }')

          NEW_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          echo "::add-mask::$NEW_TOKEN"
          gh secret set "${{ matrix.token.name }}" --body "$NEW_TOKEN" --repo ${{ github.repository }}
          echo "TOKEN_RENEWED=true" >> $GITHUB_ENV
      - name: Set output if token renewed
        id: set_output
        run: |
          if [[ "$TOKEN_RENEWED" == "true" ]]; then
            echo "any_renewed=true" >> $GITHUB_OUTPUT
          else
            echo "any_renewed=false" >> $GITHUB_OUTPUT
          fi
            
  send_email:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.any_token_renewed == 'true' }}
    steps:
    - name: Send Email Notification
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USER }}       
        password: ${{ secrets.EMAIL_PASSWORD }}  
        from: ${{ secrets.EMAIL_USER }}         
        to: ${{ secrets.EMAIL_USER }}            
        subject: "JFrog Token(s) Renewed"
        body: |
          One or more JFrog tokens have been renewed in repository ${{ github.repository }}.


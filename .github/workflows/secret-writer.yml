name: Update Secret

on:
  workflow_dispatch:

jobs:
  update-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Get repo public key
        id: get_key
        run: |
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GH_PAT }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/secrets/public-key)
          echo "$RESPONSE" > key.json
          echo "KEY_ID=$(jq -r .key_id key.json)" >> $GITHUB_ENV
          echo "KEY=$(jq -r .key key.json)" >> $GITHUB_ENV

      - name: Encrypt secret
        id: encrypt
        run: |
          SECRET_VALUE="my-new-secret-value"
          ENCRYPTED_VALUE=$(echo -n "$SECRET_VALUE" | openssl rsautl -encrypt -pubin -inkey <(echo "$KEY" | base64 -d) | base64 | tr -d '\n')
          echo "ENCRYPTED_VALUE=$ENCRYPTED_VALUE" >> $GITHUB_ENV

      - name: Create/update secret
        run: |
          curl -X PUT -H "Authorization: token ${{ secrets.GH_PAT }}" \
               -H "Content-Type: application/json" \
               -d "{\"encrypted_value\":\"$ENCRYPTED_VALUE\",\"key_id\":\"$KEY_ID\"}" \
               https://api.github.com/repos/${{ github.repository }}/actions/secrets/MY_NEW_SECRET
